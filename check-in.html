<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Sustainability Check-In · The Music Makeover</title>
  <link rel="icon" href="/media/music-makeover-logo.png" type="image/png">
  <link rel="stylesheet" href="/assets/checkin.css">
  <script src="/assets/checkin-snapshot.js" defer></script>
  <script src="/assets/checkin-feedback.js" defer></script>
  <script src="/assets/checkin.js" defer></script>
</head>
<body class="checkin-body">
  <a class="skip-link" href="#checkin-main">Skip to check-in</a>
  <header class="checkin-header">
    <a href="/" aria-label="The Music Makeover home" class="checkin-brand"><img src="/media/music-makeover-logo.png" alt="" width="58" height="58"><span>The Music Makeover<small>Sound. Strategy. Sustainability.</small></span></a>
    <div class="header-end"><span class="private-label">Pre-pilot</span><button type="button" id="sign-out" class="text-button" hidden>Sign out</button></div>
  </header>
  <main id="checkin-main" class="checkin-main">
    <div id="checkin-app"><p role="status">Opening your check-in…</p></div>
    <p id="checkin-error" role="alert" class="checkin-error" hidden></p>
    <p id="save-status" role="status" class="save-status" aria-live="polite"></p>
  </main>
  <footer class="checkin-footer"><span>© The Music Makeover</span><span>A little space to tell the truth about how work feels.</span><a href="/privacy-policy">Privacy policy</a></footer>
  <noscript><p class="checkin-error">Please enable JavaScript to use this secure check-in.</p></noscript>
</body>
</html>
